<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <title>Stick War</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111318;
        overscroll-behavior: none;
      }

      #bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #111318;
        color: #f4f4f4;
        font: 600 1rem/1.5 system-ui, sans-serif;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      .loading-indicator {
        display: grid;
        justify-items: center;
        gap: 1rem;
        width: min(20rem, calc(100vw - 3rem));
      }

      .loading-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.25rem solid rgb(244 244 244 / 25%);
        border-top-color: #f4f4f4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #loading-progress {
        width: 100%;
        height: 0.5rem;
        accent-color: #f4f4f4;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bevy" tabindex="0"></canvas>
    <div id="status" role="status" aria-live="polite">
      <div class="loading-indicator">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span id="status-message">Loading Stick War…</span>
        <progress id="loading-progress" aria-label="Game download progress"></progress>
      </div>
    </div>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
