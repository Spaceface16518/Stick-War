<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#160e09" />
    <title>Stick War</title>
    <style>
      @font-face {
        font-family: "Cinzel";
        src: url("./assets/fonts/Cinzel.ttf") format("truetype");
        font-weight: 400 900;
        font-display: swap;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #160e09;
        overscroll-behavior: none;
      }

      #bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgb(20 12 7 / 72%), rgb(20 12 7 / 82%)),
          url("./assets/environment/battlefield.png") center / cover no-repeat,
          #160e09;
        color: #e1c795;
        font: 700 1rem/1.5 "Cinzel", Georgia, serif;
        letter-spacing: 0.08em;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      .loading-indicator {
        display: grid;
        justify-items: center;
        gap: 1rem;
        width: min(24rem, calc(100vw - 3rem));
        padding: 2rem 2.25rem;
        border: 2px solid #b88835;
        border-radius: 0.2rem;
        background: rgb(32 18 10 / 92%);
        box-shadow: 0 1.25rem 4rem rgb(0 0 0 / 45%);
      }

      .loading-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 0.22rem solid rgb(184 136 53 / 28%);
        border-top-color: #f2c75c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #loading-progress {
        width: 100%;
        height: 0.6rem;
        accent-color: #b88835;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bevy" tabindex="0"></canvas>
    <div id="status" role="status" aria-live="polite">
      <div class="loading-indicator">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span id="status-message">Loading Stick War…</span>
        <progress id="loading-progress" aria-label="Game download progress"></progress>
      </div>
    </div>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
